name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the issue.
      placeholder: |
        1. Log in as a service provider
        2. Open the calendar
        3. Click "Create timeslot"
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages or stack traces if available.
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: User role
      description: Which role were you logged in as when the bug occurred?
      options:
        - Admin
        - Service provider
        - Client
        - Not logged in
        - N/A

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.4.1

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: e.g. 13.5.0

  - type: input
    id: browser
    attributes:
      label: Browser (if frontend issue)
      placeholder: e.g. Chrome 124, Firefox 125

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that might help.
